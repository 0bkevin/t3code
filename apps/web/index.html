<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedColors = window.localStorage.getItem("t3code:theme-colors");
          const colors = storedColors ? JSON.parse(storedColors) : null;
          const isHexColor = (value) =>
            typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value.trim());
          if (isHexColor(colors?.accentColor)) {
            const accentColor = colors.accentColor.trim().toLowerCase();
            const channels = [1, 3, 5].map((offset) =>
              Number.parseInt(accentColor.slice(offset, offset + 2), 16),
            );
            const [red, green, blue] = channels.map((channel) => {
              const value = channel / 255;
              return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
            });
            const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;
            document.documentElement.style.setProperty("--theme-accent-seed", accentColor);
            document.documentElement.style.setProperty(
              "--theme-accent-foreground",
              luminance >= 0.179 ? "#000000" : "#ffffff",
            );
          }
          if (isHexColor(colors?.neutralColor)) {
            document.documentElement.style.setProperty(
              "--theme-neutral-seed",
              colors.neutralColor.trim().toLowerCase(),
            );
          }
          if (typeof colors?.contrast === "number" && Number.isFinite(colors.contrast)) {
            const contrast = Math.min(100, Math.max(0, colors.contrast));
            const properties = {
              "--theme-background-strength": `${4 + contrast * 0.12}%`,
              "--theme-surface-strength": `${6 + contrast * 0.16}%`,
              "--theme-control-strength": `${3 + contrast * 0.08}%`,
              "--theme-accent-strength": `${6 + contrast * 0.2}%`,
              "--theme-border-strength": `${8 + contrast * 0.16}%`,
            };
            for (const [property, value] of Object.entries(properties)) {
              document.documentElement.style.setProperty(property, value);
            }
          }
        } catch {}
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
