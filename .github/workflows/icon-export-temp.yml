name: temporary icon export

on:
  push:
    branches:
      - fix/normalize-app-icon-glyph-size

permissions:
  contents: read

jobs:
  export:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: probe icon composer exports
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/icon-probe
          tool=/Applications/Xcode_26.0.1.app/Contents/Applications/Icon\ Composer.app/Contents/Executables/ictool
          "$tool" --version
          "$tool" --help 2>&1 | tee /tmp/icon-probe/ictool-help.txt || true
          find /Applications -path '*Icon Composer.app/Contents/Executables/ictool' -type f -print > /tmp/icon-probe/tools.txt
          while IFS= read -r candidate; do
            printf '\n%s\n' "$candidate" >> /tmp/icon-probe/versions.txt
            "$candidate" --version >> /tmp/icon-probe/versions.txt 2>&1 || true
          done < /tmp/icon-probe/tools.txt
          strings "$tool" | grep -iE 'pre.?tahoe|macOS|appearance|platform|rendition|export' | sort -u > /tmp/icon-probe/ictool-strings.txt || true
          for platform in iOS macOS 'macOS pre-Tahoe' macOS-pre-Tahoe; do
            for appearance in Light Default; do
              slug="$(echo "$platform-$appearance" | tr ' ' '_' | tr '[:upper:]' '[:lower:]')"
              "$tool" assets/prod/app-icon.icon --export-preview "$platform" "$appearance" 1024 1024 1 "/tmp/icon-probe/prod-$slug.png" > "/tmp/icon-probe/prod-$slug.log" 2>&1 || true
            done
          done
          for variant in dev nightly prod; do
            "$tool" "assets/$variant/app-icon.icon" --export-preview iOS Light 1024 1024 1 "/tmp/icon-probe/$variant-ios.png" > "/tmp/icon-probe/$variant-ios.log" 2>&1 || true
          done
          ls -lah /tmp/icon-probe
          file /tmp/icon-probe/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: icon-probe
          path: /tmp/icon-probe/
