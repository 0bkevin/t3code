name: temporary icon export

on:
  push:
    branches:
      - fix/normalize-app-icon-glyph-size

permissions:
  contents: read

jobs:
  export:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: inspect icon composer
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/icon-export
          tool="$(find /Applications -path '*Icon Composer.app/Contents/Executables/ictool' -type f | head -n 1)"
          echo "$tool" | tee /tmp/icon-export/tool.txt
          "$tool" --version | tee /tmp/icon-export/version.txt
          "$tool" --help 2>&1 | tee /tmp/icon-export/help.txt || true
          strings "$tool" | grep -iE 'pre.?tahoe|macOS|appearance|platform|rendition|export' | sort -u > /tmp/icon-export/strings.txt || true
      - name: export generated icons
        run: vp run icons:export
      - name: probe macOS CLI renditions
        shell: bash
        run: |
          set -x
          tool="$(cat /tmp/icon-export/tool.txt)"
          for rendition in Default Light Dark Tinted ClearLight ClearDark; do
            "$tool" assets/prod/app-icon.icon --export-image --output-file "/tmp/icon-export/prod-macos-$rendition.png" --platform macOS --rendition "$rendition" --width 1024 --height 1024 --scale 1 --design-generation 26 > "/tmp/icon-export/prod-macos-$rendition.log" 2>&1 || true
          done
          find /tmp/icon-export -maxdepth 1 -type f -print -exec file {} \;
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exported-icons-v2
          path: |
            assets/
            apps/web/public/favicon*
            apps/web/public/apple-touch-icon.png
            /tmp/icon-export/
