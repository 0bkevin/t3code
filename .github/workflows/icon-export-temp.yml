name: temporary icon export

on:
  push:
    branches:
      - fix/normalize-app-icon-glyph-size

permissions:
  contents: read

jobs:
  export:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: probe icon composer gui
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/icon-gui
          app="$(find /Applications -path '*Icon Composer.app' -type d | head -n 1)"
          echo "$app" > /tmp/icon-gui/app.txt
          find "$app/Contents" -type f -maxdepth 4 -print > /tmp/icon-gui/files.txt
          while IFS= read -r file; do
            strings "$file" 2>/dev/null | grep -iE 'pre.?tahoe|export.*png|export image|appearance|platform' | sed "s|^|$file: |" || true
          done < /tmp/icon-gui/files.txt > /tmp/icon-gui/strings.txt
          open -a "$app" "$PWD/assets/prod/app-icon.icon" || true
          sleep 8
          osascript <<'APPLESCRIPT' > /tmp/icon-gui/actions.log 2>&1 || true
          tell application "System Events"
            tell process "Icon Composer"
              click button 3 of group 1 of window 1
              delay 10
              click menu item "Export…" of menu 1 of menu bar item "File" of menu bar 1
              delay 5
            end tell
          end tell
          APPLESCRIPT
          osascript -e 'tell application "System Events" to tell process "Icon Composer" to get entire contents of window 1' > /tmp/icon-gui/window.txt 2>&1 || true
          osascript -e 'tell application "System Events" to tell process "Icon Composer" to get name of every window' > /tmp/icon-gui/windows.txt 2>&1 || true
          screencapture -x /tmp/icon-gui/export-dialog.png > /tmp/icon-gui/screencapture.log 2>&1 || true
          cat /tmp/icon-gui/actions.log /tmp/icon-gui/windows.txt /tmp/icon-gui/window.txt /tmp/icon-gui/screencapture.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: icon-gui-probe
          path: /tmp/icon-gui/
